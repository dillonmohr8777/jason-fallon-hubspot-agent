name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Safety tests (no live token)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out agent
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run safety tests
        run: npm test
