name: Jason HubSpot Live Audit

on:
  schedule:
    # Weekday daily-health at 12:00 UTC (07:00-08:00 America/New_York).
    # Scheduled runs carry no inputs, so the job defaults to daily-health.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: Read-only Jason/Momentum audit to run
        required: true
        default: all
        type: choice
        options:
          - all
          - verify-ready
          - window-report
          - daily-health
          - snapshot
          - schema-audit
          - lead-source-audit
          - attribution-audit

permissions:
  contents: read

concurrency:
  group: jason-hubspot-live-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Portal 50612503 read-only audit
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      JASON_HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.JASON_HUBSPOT_PRIVATE_APP_TOKEN }}
      AUDIT_COMMAND: ${{ inputs.command || 'daily-health' }}

    steps:
      - name: Check out agent
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run safety tests
        run: npm test

      - name: Run portal-guarded live audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:JASON_HUBSPOT_PRIVATE_APP_TOKEN)) {
            throw "The JASON_HUBSPOT_PRIVATE_APP_TOKEN Actions secret is unavailable."
          }

          node .\agent\jason-hubspot-agent.mjs verify-ready
          if ($LASTEXITCODE -ne 0) {
            throw "Portal readiness verification failed."
          }

          switch ("$env:AUDIT_COMMAND") {
            "all" {
              node .\agent\jason-hubspot-agent.mjs snapshot
              if ($LASTEXITCODE -ne 0) { throw "Snapshot failed." }
              node .\agent\jason-hubspot-agent.mjs window-report
              if ($LASTEXITCODE -ne 0) { throw "Window report failed." }
              node .\agent\jason-hubspot-agent.mjs daily-health
              if ($LASTEXITCODE -ne 0) { throw "Daily health failed." }
              node .\agent\jason-hubspot-agent.mjs schema-audit
              if ($LASTEXITCODE -ne 0) { throw "Schema audit failed." }
              node .\agent\jason-hubspot-agent.mjs lead-source-audit
              if ($LASTEXITCODE -ne 0) { throw "Lead source audit failed." }
              node .\agent\jason-hubspot-agent.mjs attribution-audit
              if ($LASTEXITCODE -ne 0) { throw "Attribution audit failed." }
            }
            "window-report" {
              node .\agent\jason-hubspot-agent.mjs window-report
              if ($LASTEXITCODE -ne 0) { throw "Window report failed." }
            }
            "daily-health" {
              node .\agent\jason-hubspot-agent.mjs daily-health
              if ($LASTEXITCODE -ne 0) { throw "Daily health failed." }
            }
            "snapshot" {
              node .\agent\jason-hubspot-agent.mjs snapshot
              if ($LASTEXITCODE -ne 0) { throw "Snapshot failed." }
            }
            "schema-audit" {
              node .\agent\jason-hubspot-agent.mjs schema-audit
              if ($LASTEXITCODE -ne 0) { throw "Schema audit failed." }
            }
            "lead-source-audit" {
              node .\agent\jason-hubspot-agent.mjs lead-source-audit
              if ($LASTEXITCODE -ne 0) { throw "Lead source audit failed." }
            }
            "attribution-audit" {
              node .\agent\jason-hubspot-agent.mjs attribution-audit
              if ($LASTEXITCODE -ne 0) { throw "Attribution audit failed." }
            }
          }

          "Live read-only audit completed for Jason/Momentum portal 50612503." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload aggregate audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: jason-hubspot-${{ inputs.command || 'daily-health' }}-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
          retention-days: 14
